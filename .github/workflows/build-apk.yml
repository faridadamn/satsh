name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release signing: isi 4 secrets di repo Settings → Secrets → Actions.
      # ANDROID_KEYSTORE_B64 = base64 dari file satsh-release.jks
      # KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD = isinya key.properties
      - name: Restore keystore (release)
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then echo "skip: no keystore secret"; exit 0; fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > ../android/satsh-release.jks
          cat > ../android/key.properties <<EOF
          storeFile=satsh-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK (release, arm64)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: satsh-release-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
